name: Download Historical Research Data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-research-data
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      RESEARCH_DATA_DIR: research/data
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "alpaca-py" "pandas" "pandas-market-calendars" "python-dotenv"

      - name: Download and validate historical bars
        run: python research/fetch_data.py

      - name: Upload CSVs and manifest as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-historical-research-data-${{ github.run_id }}
          path: research/data/
          if-no-files-found: error
          retention-days: 14
