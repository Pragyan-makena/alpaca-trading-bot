name: Offline research tests

on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research-tests.yml'
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s research/tests -v
